<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="50%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#ffa500"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a5c"/>
      <stop offset="100%" style="stop-color:#1a1a3c"/>
    </linearGradient>
    <linearGradient id="crack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crackspark">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Shield (cracked) -->
  <g transform="translate(110, 60)">
    <!-- Shield body -->
    <path d="M0,-60 L50,-45 L50,15 Q50,60 0,80 Q-50,60 -50,15 L-50,-45 Z"
          fill="url(#shield)" stroke="#5a5a8c" stroke-width="2.5" opacity="0.9"/>
    <!-- Lock/key icon on shield -->
    <circle cx="0" cy="-10" r="14" fill="none" stroke="#6a6a9c" stroke-width="3"/>
    <rect x="-6" y="2" width="12" height="18" rx="2" fill="#6a6a9c"/>
    <rect x="-2" y="8" width="4" height="8" rx="1" fill="#1a1a3c"/>

    <!-- CRACK through shield -->
    <path d="M-8,-55 L2,-30 L-6,-15 L5,5 L-3,25 L8,50 L0,75"
          fill="none" stroke="url(#crack)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"
          filter="url(#crackspark)"/>
    <!-- Crack sparks -->
    <circle cx="2" cy="-30" r="3" fill="#ff6b35" opacity="0.8"/>
    <circle cx="5" cy="5" r="2.5" fill="#ffa500" opacity="0.7"/>
    <circle cx="-3" cy="25" r="2" fill="#ff4444" opacity="0.6"/>
  </g>

  <!-- PACFORGE title -->
  <text x="225" y="135" font-family="'Courier New', 'Fira Code', monospace"
        font-size="72" font-weight="bold" fill="url(#glow)"
        filter="url(#textglow)" letter-spacing="6">PACFORGE</text>

  <!-- Subtitle -->
  <text x="228" y="175" font-family="'Segoe UI', 'Helvetica Neue', sans-serif"
        font-size="18" fill="#8888aa" letter-spacing="4">
    ARM64 POINTER AUTHENTICATION BYPASS TOOLKIT
  </text>

  <!-- Decorative line -->
  <line x1="228" y1="190" x2="780" y2="190" stroke="url(#glow)" stroke-width="1" opacity="0.4"/>

  <!-- Stats bar -->
  <g transform="translate(228, 215)" font-family="'Courier New', monospace" font-size="13">
    <text fill="#ff6b35">35</text><text x="22" fill="#6a6a8c"> detection modules</text>
    <text x="180" fill="#ff6b35">8</text><text x="192" fill="#6a6a8c"> attack strategies</text>
    <text x="360" fill="#ff6b35">Z3</text><text x="382" fill="#6a6a8c"> constraint solver</text>
  </g>

  <!-- Bottom tag badges -->
  <g transform="translate(228, 255)">
    <!-- Python badge -->
    <rect width="72" height="24" rx="4" fill="#306998"/>
    <text x="36" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFD43B" font-weight="bold">Python</text>
    <!-- ARM64 badge -->
    <rect x="82" width="68" height="24" rx="4" fill="#2d2d4e"/>
    <text x="116" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8888cc" font-weight="bold">ARM64</text>
    <!-- PAC badge -->
    <rect x="160" width="50" height="24" rx="4" fill="#4a1a1a"/>
    <text x="185" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ff6b35" font-weight="bold">PAC</text>
    <!-- BTI badge -->
    <rect x="220" width="44" height="24" rx="4" fill="#1a3a1a"/>
    <text x="242" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6bff6b" font-weight="bold">BTI</text>
  </g>

  <!-- Hex decoration (right side) -->
  <g transform="translate(760, 70)" font-family="'Courier New', monospace" font-size="10" fill="#2a2a4c">
    <text>d503233f paciasp</text>
    <text y="16">dac10020 pacia</text>
    <text y="32">dac123e0 paciza</text>
    <text y="48">dac11020 autia</text>
    <text y="64">d50323bf autiasp</text>
    <text y="80">d61f0100 br x8</text>
    <text y="96">d503245f bti c</text>
  </g>
</svg>
